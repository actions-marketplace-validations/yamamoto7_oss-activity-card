name: Bug report
description: The card looks wrong, a PR is missing or miscounted, or the workflow fails.
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting. A link to where the card is shown helps the most.
  - type: input
    id: where
    attributes:
      label: Where is the card?
      description: Your profile or the repository using the action.
      placeholder: https://github.com/<you>
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: What's wrong?
      options:
        - The card looks wrong (layout, text, colors)
        - The linked card in the README (gaps, links, rows)
        - A PR is missing, or counts are wrong
        - The workflow fails
        - Something else
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: A screenshot helps for anything visual. Say whether it's light or dark mode, and desktop or phone.
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Config
      description: Your `.github/oss-card.yml`, if you have one.
      render: yaml
  - type: textarea
    id: log
    attributes:
      label: Workflow log
      description: If the workflow failed, the output of the "Run yamamoto7/oss-activity-card@v1" step.
      render: text
  - type: input
    id: version
    attributes:
      label: Version
      description: The ref in `uses:`, such as `v1` or `v1.6.0`.
      placeholder: v1
