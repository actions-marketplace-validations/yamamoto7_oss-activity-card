name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: dist/ is up to date
        run: git diff --exit-code -- dist/ || (echo "Run npm run build and commit dist/." && exit 1)

  card:
    # Renders a real card with the action itself, as a smoke test.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./
        with:
          user: ${{ github.repository_owner }}
          config: examples/does-not-exist.yml
          output: out/card.svg
          output-dark: out/card-dark.svg
      - uses: actions/upload-artifact@v4
        with:
          name: card
          path: out/
