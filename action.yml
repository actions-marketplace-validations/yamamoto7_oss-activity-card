name: OSS Activity Card
description: Show the pull requests you've had merged into other people's open source projects on your GitHub profile.
author: yamamoto7
branding:
  icon: git-merge
  color: purple

inputs:
  github-token:
    description: Token used to search pull requests. The default workflow token can read public data.
    default: ${{ github.token }}
  user:
    description: GitHub user whose pull requests are shown. Defaults to the owner of the repository running the workflow.
    default: ${{ github.repository_owner }}
  config:
    description: Path to the card's config file. The defaults are used when the file doesn't exist.
    default: .github/oss-card.yml
  output:
    description: Where to write the light-theme SVG.
    default: oss-card.svg
  output-dark:
    description: Where to write the dark-theme SVG. Set to "none" to skip it.
    default: oss-card-dark.svg
  readme:
    description: >-
      README to put a linked version of the card into, between <!-- oss-card:start --> and
      <!-- oss-card:end -->. The card is cut into one image per row so each PR, owner and repo links
      to its page. Leave empty to only write the single-image SVGs.
    default: ""
  slices-dir:
    description: Directory for the per-row images used by the linked card.
    default: oss-card

outputs:
  path:
    description: Path of the light-theme SVG.
  path-dark:
    description: Path of the dark-theme SVG, unless output-dark is "none".

runs:
  using: node24
  main: dist/index.js
